name: Release

# Push a tag vX.Y.Z (matching VERSION in the Makefile) to publish a GitHub
# release with the source tarball, a .deb, and an AUR PKGBUILD whose
# sha256sums match that tarball.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the Makefile VERSION
        run: |
          tag="${GITHUB_REF_NAME#v}"
          mk="$(sed -n 's/^VERSION *= *//p' Makefile)"
          if [ "$tag" != "$mk" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Makefile VERSION $mk"
            exit 1
          fi
          echo "VERSION=$tag" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential debhelper devscripts \
            libcurl4-openssl-dev pkg-config

      - name: Unit tests
        run: make test

      - name: Source tarball
        run: make dist

      - name: Debian package
        run: pkg/debian/build-deb.sh "btorrent-$VERSION.tar.gz" dist

      - name: AUR PKGBUILD with checksum
        run: |
          sum="$(sha256sum "btorrent-$VERSION.tar.gz" | cut -d' ' -f1)"
          sed -e "s/^pkgver=.*/pkgver=$VERSION/" \
              -e "s/^sha256sums=.*/sha256sums=('$sum')/" \
              pkg/aur/PKGBUILD > dist/PKGBUILD

      - name: Release notes from CHANGES.md
        run: |
          # The "## vX.Y.Z" section, without its heading and "---" separators.
          awk -v hdr="## v$VERSION" '
            index($0, "## v") == 1 { if (on) exit; on = ($0 == hdr || index($0, hdr " ") == 1); next }
            on && $0 != "---"
          ' CHANGES.md > dist/notes.md
          [ -s dist/notes.md ] || echo "btorrent $VERSION" > dist/notes.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "btorrent $VERSION" \
            --notes-file dist/notes.md \
            "btorrent-$VERSION.tar.gz" dist/*.deb dist/PKGBUILD
